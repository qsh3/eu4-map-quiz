<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>罗马血统测试 · 全地图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101d26'/%3E%3Cpath d='M16 3 20 12 29 16 20 20 16 29 12 20 3 16 12 12Z' fill='%23d9b77a'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box} :root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#edf0ed;background:#10191f}
  body{margin:0}
  button,select{font:inherit}
  button{cursor:pointer;border:1px solid #485054;color:#e8e7e0;background:#233039;border-radius:5px;padding:10px 16px}
  button:hover:not(:disabled){background:#35434b}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,select:focus-visible{outline:3px solid #e0ba76;outline-offset:3px}
  header{height:72px;padding:0 3vw;display:flex;align-items:center;gap:24px;border-bottom:1px solid #354048}
  .brand{display:flex;align-items:center;gap:14px}
  .compass{font-size:43px;color:#d9b77a}
  .brand div{display:flex;align-items:baseline;gap:16px}
  .brand b{font-family:Georgia,serif;font-size:30px;letter-spacing:3px}
  .brand span{color:#d9b77a}
  .edition{margin-left:auto;color:#9aa9b0;font-size:14px}
  main{margin:auto;padding:16px 1.5vw 12px}
  .command{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}
  .question>span,.kicker{font-size:12px;color:#d7b87f;letter-spacing:2px}
  h1{font-size:30px;margin:7px 0;font-weight:600;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  p{color:#adb9bf;line-height:1.7;margin:0;font-size:16px}
  .metrics{display:flex;gap:26px;flex-shrink:0}
  .metrics>div{display:flex;flex-direction:column;gap:8px;min-width:55px}
  .metrics span{font-size:14px;color:#9eaeb6}
  .metrics b{font-size:27px;font-weight:500;font-variant-numeric:tabular-nums}
  .metrics b span{margin-left:5px}
  .clock b{color:#e4c894}
  .elapsed-live b{color:#18e6b4;white-space:nowrap;font-size:23px}
  .time-track{height:3px;background:#354149}
  #progress{height:100%;background:#dfbd7d;width:100%;transition:width .1s linear}
  .map-shell{position:relative;border:1px solid #495251;overflow:hidden;background:#5b6a74;border-radius:0 0 6px 6px}
  #viewport{height:max(420px,calc(100dvh - 300px));overflow:hidden;touch-action:none;cursor:crosshair;position:relative}
  #cv{position:absolute;left:0;top:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .map-tools{position:absolute;bottom:18px;right:18px;display:flex;align-items:center;background:#132028ed;border:1px solid #53606a;border-radius:6px;z-index:2}
  .map-tools button{border:0;background:transparent}
  .map-tools span{font-size:14px;min-width:48px;text-align:center}
  .map-hint{position:absolute;bottom:21px;left:18px;background:#132028e8;padding:8px 12px;border-radius:4px;color:#c2cbd0;font-size:13px;pointer-events:none}
  .panel{position:absolute;inset:0;display:grid;place-items:center;background:#0b151cbf;backdrop-filter:blur(3px);z-index:3}
  .panel[hidden]{display:none}
  .panel-inner{width:min(940px,94%);max-height:95%;overflow:auto;padding:32px;background:#13212bf5;border:1px solid #897653;border-radius:8px;box-shadow:0 20px 80px #0007}
  .panel h2{font-size:28px;font-weight:500;margin:13px 0 16px}
  .panel label{display:block;font-size:14px;margin-top:23px;margin-bottom:8px;color:#c8d0d3}
  .panel select{width:100%;padding:12px;border-radius:4px;border:1px solid #58616a;background:#1d2d37;color:#edf0ed}
  .primary{background:#dbba7f;color:#1a252c;border-color:#dbba7f;font-weight:600}
  .primary:hover:not(:disabled){background:#eed19e}
  .panel .primary{width:100%;margin-top:20px;padding:13px}
  .panel .primary span{float:right}
  .panel small{display:block;color:#8fa1aa;text-align:center;line-height:1.6;margin-top:15px;font-size:13px}
  #regionPicker{border:0;padding:0;margin:20px 0 0}
  #regionPicker[hidden]{display:none}
  #regionPicker legend{font-size:14px;color:#c8d0d3;margin-bottom:10px}
  .region-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .panel .region-card{margin:0;display:flex;align-items:center;gap:10px;padding:16px 14px;min-height:64px;border:2px solid #52626e;border-radius:6px;background:#1d2d37;cursor:pointer;line-height:1.6}
  .region-card:has(input:checked){border-color:#18e6b4;background:#173b39}
  .region-card input{width:18px;height:18px;accent-color:#18e6b4;flex-shrink:0}
  #selectionCount{margin-top:12px;color:#18e6b4;font-size:14px}
  .settings-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  #modeHelp{font-size:14px;margin-top:12px;min-height:24px}
  footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;gap:15px}
  footer>span{color:#90a0a8;font-size:13px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#c3cdd1}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:3px}
  .legend .unanswered{background:#eef0ef}
  .legend .correct{background:#18e6b4}
  .legend .incorrect{background:#ff5a91}
  .legend .excluded{background:#434d55}
  .legend .uncolonized{background:#7a7260}
  .legend .wasteland{background:#5d574f}
  .next-controls{display:inline-flex;align-items:center;gap:10px}
  .next-controls kbd{font-family:inherit;font-size:14px;color:#d1dbe0;padding:5px 9px;border:1px solid #65717b;border-bottom-width:3px;border-radius:4px}
  .next-controls button:disabled+kbd{opacity:.4}
  .elapsed-result{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-top:1px solid #3c4b55;padding:14px 0;margin-bottom:8px}
  .elapsed-result span{font-size:14px;color:#9eafb7}
  .elapsed-result strong{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
  #finalScore{font:64px Georgia,serif;color:#18e6b4;margin-bottom:6px}
  #rating{font-size:34px;font-weight:700;color:#d9b77a;letter-spacing:4px;margin:0 0 18px;text-shadow:0 0 18px rgba(217,183,122,.4)}
  #scopeWrap[hidden]{display:none}
  .result-label{font-size:14px;color:#9eafb7}
  #review{font-size:14px;line-height:1.8;color:#c7b08d;max-height:90px;overflow:auto;margin-top:10px}
  #viewMap{width:100%;margin-top:20px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b151c;z-index:9;color:#7ec8ff;font-size:15px}
  #loading .sub{font-size:11px;color:#5a7a9a;margin-top:6px;text-align:center}
  .flag{width:70px;height:48px;object-fit:cover;border:1px solid #6a7883;border-radius:3px;background:#233039;display:block}
  .flag.flag-sm{width:34px;height:23px;display:inline-block;vertical-align:-4px;margin-right:6px}
  #flagBox{display:none;margin:10px 0 2px}
  #flagBox.on{display:flex;align-items:center;gap:14px}
  #flagBox img{border-radius:4px}
  #flagBox em{font-style:normal;color:#9aa9b0;font-size:13px;letter-spacing:1px}
  @media(max-width:1000px){.command{flex-wrap:wrap}.metrics{flex-wrap:wrap;gap:16px}}
  @media(hover:none){#cv{cursor:default}.map-hint{font-size:12px}}
  @media(max-width:760px){
    header{height:56px;padding:0 12px;gap:8px}
    .brand{gap:8px}
    .brand b{font-size:20px;letter-spacing:2px}
    .brand span{display:none}
    .compass{font-size:26px}
    .edition{display:none}
    header button{padding:9px 11px;font-size:13px}
    main{padding:10px 10px 8px}
    .command{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:10px}
    .question>span{font-size:11px;letter-spacing:1px}
    h1{font-size:26px;margin:4px 0;line-height:1.15}
    .question p{font-size:13px;line-height:1.5}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
    .metrics>div{min-width:0;gap:3px}
    .metrics>div:first-child{display:flex}
    .metrics>div:nth-child(5){display:none}
    .metrics span{font-size:11px}
    .metrics b{font-size:19px}
    .elapsed-live b{font-size:16px}
    .time-track{margin-top:2px}
    #viewport{height:calc(100dvh - 320px);min-height:250px}
    .map-tools{bottom:10px;right:10px}
    .map-tools button{padding:9px 13px;min-width:40px}
    .map-hint{display:none}
    .panel-inner{width:100%;max-height:100%;padding:22px 18px;border-radius:0}
    .panel h2{font-size:23px;margin:10px 0 12px}
    .panel .region-card{padding:12px;min-height:54px;font-size:13px}
    .region-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .settings-row{grid-template-columns:1fr;gap:0}
    footer{flex-direction:column;align-items:stretch;gap:8px;padding-top:8px}
    .legend{justify-content:center;font-size:12px;gap:10px}
    #cleared{text-align:center;font-size:13px}
    .next-controls{width:100%}
    .next-controls button{flex:1;padding:12px}
    .next-controls kbd{display:none}
    .flag{width:54px;height:37px}
    #finalScore{font-size:52px;margin-bottom:4px}
    #rating{font-size:27px;letter-spacing:2px;margin-bottom:14px}
    #review{max-height:130px}
  }
  @media(max-width:380px){
    .brand b{font-size:18px}
    .metrics b{font-size:17px}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="compass">✥</span><div><b>罗马血统测试</b><span id="tagline">全地图</span></div></div>
  <div class="edition" id="edition">加载中…</div>
  <button id="sound" aria-pressed="true">音效：开</button>
  <button id="restart">重新开始</button>
</header>

<main>
  <section class="command">
    <div class="question">
      <span id="eyebrow">准备探索</span>
      <div id="flagBox"><img id="flagImg" class="flag" alt=""><em id="flagAlt"></em></div>
      <h1 id="target">看地名，点出它的地块</h1>
      <p id="message" role="status" aria-live="polite">选择题库范围，开始挑战。</p>
    </div>
    <div class="metrics">
      <div><span>题目</span><b id="round">—</b></div>
      <div><span>答对</span><b id="score">0</b></div>
      <div><span>正确率</span><b id="accuracy">—</b></div>
      <div class="clock"><span>剩余时间</span><b id="time">不限时</b></div>
      <div class="elapsed-live"><span>总耗时</span><b id="liveElapsed">0分00秒</b></div>
    </div>
  </section>

  <div class="time-track"><div id="progress"></div></div>

  <section class="map-shell">
    <div id="viewport">
      <canvas id="cv"></canvas>
    </div>
    <div class="map-tools">
      <button id="zoomOut" aria-label="缩小地图">−</button>
      <span id="zoom">100%</span>
      <button id="zoomIn" aria-label="放大地图">＋</button>
      <button id="fit">复位</button>
    </div>
    <div class="map-hint">拖动 / 双指缩放 · 点击作答</div>

    <div id="startPanel" class="panel">
      <div class="panel-inner">
        <span class="kicker">ROMAN BLOODLINE TEST · WORLD MAP</span>
        <h2>选择玩法，开始挑战</h2>
        <div class="settings-row">
          <div><label for="playmode">玩法</label>
            <select id="playmode">
              <option value="province" selected>猜地块 · 看地名，点出它的地块</option>
              <option value="country">猜国家 · 看国旗，点出它的领土</option>
            </select></div>
          <div><label for="mode">题量</label>
            <select id="mode">
              <option value="normal" selected>正常 · 10 题</option>
              <option value="challenge">挑战 · 30 题</option>
              <option value="nightmare">噩梦 · 50 题</option>
              <option value="complete">完全 · 全部题</option>
            </select></div>
        </div>
        <div id="scopeWrap">
          <label for="scope">题库范围</label>
          <select id="scope">
            <option value="all">全部</option>
            <option value="regions">自选区域 · 可多选</option>
          </select>
        </div>
        <fieldset id="regionPicker" hidden>
          <legend>勾选出题区域</legend>
          <div id="regionCards" class="region-grid"></div>
          <p id="selectionCount" role="status"></p>
        </fieldset>
        <div class="settings-row">
          <div><label for="duration">每题限时</label>
            <select id="duration">
              <option value="0" selected>不限时</option>
              <option value="10">10 秒 · 挑战</option>
              <option value="20">20 秒 · 标准</option>
              <option value="30">30 秒 · 从容</option>
            </select></div>
          <div><label for="only1444">国家筛选</label>
            <select id="only1444">
              <option value="1" selected>仅 1444 年存在的国家</option>
              <option value="0">全部国家（含可成立国）</option>
            </select></div>
        </div>
        <p id="modeHelp"></p>
        <button id="start" class="primary">开始挑战 <span>→</span></button>
        <small id="coverage"></small>
      </div>
    </div>

    <div id="resultPanel" class="panel" hidden>
      <div class="panel-inner">
        <span class="kicker">TEST COMPLETE</span>
        <h2 id="resultTitle">本轮挑战完成</h2>
        <span class="result-label">本局正确率</span>
        <div id="finalScore"></div>
        <div id="rating"></div>
        <div class="elapsed-result"><span>总耗时</span><strong id="totalElapsed">—</strong></div>
        <p id="summary"></p>
        <div id="review"></div>
        <button id="viewMap">查看完成地图</button>
        <button id="again" class="primary">再来一局 ↻</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="legend">
      <span><i class="unanswered"></i>未答</span>
      <span><i class="correct"></i>答对</span>
      <span><i class="incorrect"></i>答错 / 超时</span>
      <span><i class="excluded"></i>不出题</span>
      <span><i class="uncolonized"></i>未殖民</span>
      <span><i class="wasteland"></i>不可通行</span>
    </div>
    <span id="cleared">已完成 0 / 0</span>
    <span class="next-controls"><button id="next" class="primary" disabled>下一题 →</button><kbd>空格</kbd></span>
  </footer>
</main>

<div id="loading">
  <div>
    <div id="loading-text">正在加载地图数据...</div>
    <div class="sub">首次加载可能需要 10-30 秒</div>
  </div>
</div>

function logicalW() { return cv.width / dpr; }
function logicalH() { return cv.height / dpr; }

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const w = viewport.clientWidth || 800;
  const h = viewport.clientHeight || 500;
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
}

function fit() {
  const lw = logicalW(), lh = logicalH();
  const cw = Math.max(1, content.x1 - content.x0);
  const ch = Math.max(1, content.y1 - content.y0);
  const s = Math.min(lw / cw, lh / ch) * 0.96;
  camera.zoom = s;
  baseZoom = s;
  minZoom = s;
  camera.x = (lw - cw * s) / 2 - content.x0 * s;
  camera.y = (lh - ch * s) / 2 - content.y0 * s;
  updateZoomLabel();
}

function clampCamera() {
  const lw = logicalW(), lh = logicalH();
  const z = camera.zoom;
  const pad = 60;
  const mw = (content.x1 - content.x0) * z, mh = (content.y1 - content.y0) * z;
  if (mw <= lw) camera.x = (lw - mw) / 2 - content.x0 * z;
  else camera.x = Math.min(pad - content.x0 * z, Math.max(lw - pad - content.x1 * z, camera.x));
  if (mh <= lh) camera.y = (lh - mh) / 2 - content.y0 * z;
  else camera.y = Math.min(pad - content.y0 * z, Math.max(lh - pad - content.y1 * z, camera.y));
}

function updateZoomLabel() {
  const pct = Math.round(camera.zoom / Math.max(0.0001, baseZoom) * 100);
  $('zoom').textContent = pct + '%';
}

function zoomBy(f, cx, cy) {
  const lw = logicalW(), lh = logicalH();
  cx = cx === undefined ? lw / 2 : cx;
  cy = cy === undefined ? lh / 2 : cy;
  const nz = Math.max(minZoom, Math.min(MAX_ZOOM, camera.zoom * f));
  if (nz === camera.zoom) return;
  const bx = (cx - camera.x) / camera.zoom, by = (cy - camera.y) / camera.zoom;
  camera.zoom = nz;
  camera.x = cx - bx * nz; camera.y = cy - by * nz;
  clampCamera(); updateZoomLabel(); render();
}

function parseCssRules(cssText) {
  const rules = {};
  cssText = cssText.replace(/\/\*[\s\S]*?\*\//g, '');
  const blockRe = /([^{]+)\{([^}]*)\}/g;
  let m;
  while ((m = blockRe.exec(cssText)) !== null) {
    const fillMatch = m[2].match(/fill\s*:\s*([^;]+)/);
    if (!fillMatch) continue;
    const fill = fillMatch[1].trim();
    if (fill === 'none' || fill === 'transparent') continue;
    for (const cls of m[1].split(',').map(s => s.trim())) {
      if (!cls.startsWith('.')) continue;
      for (const part of cls.split('.').filter(Boolean)) rules[part] = fill;
    }
  }
  return rules;
}

function extractProvinceId(el, clsParts) {
  for (const c of clsParts) {
    const m = c.match(/^(?:prov(?:ince)?|id|p)[-_]?(\d+)(?:[_-]\d+)?$/i);
    if (m) return parseInt(m[1], 10);
  }
  const idAttr = (el.getAttribute('id') || '').trim();
  const m = idAttr.match(/^(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}

async function fetchWithTimeout(url, timeoutMs) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try { const r = await fetch(url, { signal: ctrl.signal }); clearTimeout(t); return r; }
  catch (e) { clearTimeout(t); throw e; }
}
async function fetchWithRetry(url, label, timeoutMs = 25000, retries = 1) {
  for (let a = 0; a <= retries; a++) {
    try {
      if (a > 0) { loadingText.textContent = `正在重试 ${label}（第 ${a + 1} 次）...`; await new Promise(r => setTimeout(r, 800)); }
      const r = await fetchWithTimeout(url, timeoutMs);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    } catch (e) { if (a === retries) throw e; }
  }
}

    loadingText.textContent = '正在构建拾取缓冲...';
    buildPickBufferAndBBoxes();
    computeContentBounds();

    buildRegionCards();
    loadingEl.style.display = 'none';
    resizeCanvas();
    fit();
    updateSetup();
    render();
  } catch (e) {
    console.error(e);
    loadingText.textContent = '加载失败';
    document.querySelector('#loading .sub').textContent = e.message + '（按 F12 查看控制台）';
  }
}

let pickBuf;
const PICK_W = 2816, PICK_H = 1024;
const LITTLE_ENDIAN = (() => {
  const b = new ArrayBuffer(4);
  new Uint32Array(b)[0] = 0x01020304;
  return new Uint8Array(b)[0] === 0x04;
})();
const testCanvas = document.createElement('canvas');
testCanvas.width = 1; testCanvas.height = 1;
const testCtx = testCanvas.getContext('2d');

function buildPickBufferAndBBoxes() {
  const pc = document.createElement('canvas');
  pc.width = PICK_W; pc.height = PICK_H;
  const pctx = pc.getContext('2d', { willReadFrequently: true });
  pctx.imageSmoothingEnabled = false;
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, PICK_W, PICK_H);
  const sx = PICK_W / SVG_W, sy = PICK_H / SVG_H;
  for (const p of provinces) {
    const id = p.idx + 1;
    pctx.save();
    pctx.scale(sx, sy);
    const color = `rgb(${id & 0xff},${(id >> 8) & 0xff},${(id >> 16) & 0xff})`;
    pctx.fillStyle = color; pctx.strokeStyle = color; pctx.lineWidth = 1.5;
    pctx.fill(p.path); pctx.stroke(p.path);
    pctx.restore();
  }
  const data = pctx.getImageData(0, 0, PICK_W, PICK_H);
  pickBuf = new Uint32Array(data.data.buffer);

  const bboxMap = new Array(provinces.length + 1).fill(null);
  for (let y = 0; y < PICK_H; y++) {
    const off = y * PICK_W;
    for (let x = 0; x < PICK_W; x++) {
      const v = pickBuf[off + x];
      let r, g, b;
      if (LITTLE_ENDIAN) { r = v & 0xff; g = (v >>> 8) & 0xff; b = (v >>> 16) & 0xff; }
      else { b = v & 0xff; g = (v >>> 8) & 0xff; r = (v >>> 16) & 0xff; }
      const id = (r | (g << 8) | (b << 16)) >>> 0;
      if (id === 0 || id > provinces.length) continue;
      const px = x / sx, py = y / sy;
      const bb = bboxMap[id];
      if (!bb) bboxMap[id] = [px, py, px, py];
      else {
        if (px < bb[0]) bb[0] = px;
        if (py < bb[1]) bb[1] = py;
        if (px > bb[2]) bb[2] = px;
        if (py > bb[3]) bb[3] = py;
      }
    }
  }
  for (let i = 0; i < provinces.length; i++) {
    const bb = bboxMap[i + 1];
    provinces[i].bbox = bb ? [bb[0] - 1, bb[1] - 1, bb[2] + 1, bb[3] + 1] : null;
  }
}

function computeContentBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of provinces) {
    if (!p.bbox) continue;
    if (p.bbox[0] < x0) x0 = p.bbox[0];
    if (p.bbox[1] < y0) y0 = p.bbox[1];
    if (p.bbox[2] > x1) x1 = p.bbox[2];
    if (p.bbox[3] > y1) y1 = p.bbox[3];
  }
  if (x0 !== Infinity) content = { x0, y0, x1, y1 };
}

function pickAtScreen(sx, sy) {
  if (!pickBuf) return -1;
  const wx = (sx - camera.x) / camera.zoom;
  const wy = (sy - camera.y) / camera.zoom;
  const px = (wx * PICK_W / SVG_W) | 0;
  const py = (wy * PICK_H / SVG_H) | 0;
  if (px >= 0 && py >= 0 && px < PICK_W && py < PICK_H) {
    const v = pickBuf[py * PICK_W + px];
    let r, g, b;
    if (LITTLE_ENDIAN) { r = v & 0xff; g = (v >>> 8) & 0xff; b = (v >>> 16) & 0xff; }
    else { b = v & 0xff; g = (v >>> 8) & 0xff; r = (v >>> 16) & 0xff; }
    const id = (r | (g << 8) | (b << 16)) >>> 0;
    if (id > 0 && id <= provinces.length) {
      const p = provinces[id - 1];
      if (p && p.bbox) {
        const [x0, y0, x1, y1] = p.bbox;
        if (wx >= x0 && wx <= x1 && wy >= y0 && wy <= y1 && testCtx.isPointInPath(p.path, wx, wy)) return id - 1;
      }
    }
  }
  for (let i = provinces.length - 1; i >= 0; i--) {
    const p = provinces[i];
    if (!p.bbox) continue;
    const [x0, y0, x1, y1] = p.bbox;
    if (wx < x0 || wx > x1 || wy < y0 || wy > y1) continue;
    if (testCtx.isPointInPath(p.path, wx, wy)) return i;
  }
  return -1;
}

function tagEligible(tag) { return eligibleTags.has(tag); }

function fillFor(p) {
  if (p.kind === 'wasteland') return COL.wasteland;
  if (p.kind === 'uncolonized') return COL.uncolonized;
  if (!tagEligible(p.tag)) return COL.excluded;
  if (p.status === 'correct') return COL.correct;
  if (p.status === 'incorrect') return COL.incorrect;
  return COL.unanswered;
}

function render() {
  const W = cv.width, H = cv.height, lw = W / dpr, lh = H / dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.sea;
  ctx.fillRect(0, 0, lw, lh);
  if (!provinces.length) return;

  ctx.save();
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.zoom, camera.zoom);

  const vx0 = (0 - camera.x) / camera.zoom, vy0 = (0 - camera.y) / camera.zoom;
  const vx1 = (lw - camera.x) / camera.zoom, vy1 = (lh - camera.y) / camera.zoom;
  const vis = p => p.bbox && !(p.bbox[2] < vx0 || p.bbox[0] > vx1 || p.bbox[3] < vy0 || p.bbox[1] > vy1);

  for (const p of provinces) {
    if (!vis(p)) continue;
    ctx.fillStyle = fillFor(p);
    ctx.fill(p.path);
  }
  ctx.strokeStyle = COL.border;
  ctx.lineWidth = 0.7 / camera.zoom;
  for (const p of provinces) {
    if (!vis(p)) continue;
    ctx.stroke(p.path);
  }
  if (currentIds.length) {
    ctx.strokeStyle = COL.current;
    ctx.lineWidth = 2 / camera.zoom;
    for (const i of currentIds) if (provinces[i] && vis(provinces[i])) ctx.stroke(provinces[i].path);
  }
  if (hovered >= 0 && provinces[hovered] && vis(provinces[hovered])) {
    ctx.strokeStyle = COL.hover;
    ctx.lineWidth = 1.4 / camera.zoom;
    ctx.stroke(provinces[hovered].path);
  }
  ctx.restore();
}

function continentCounts() {
  const c = new Map();
  for (const p of provinces) c.set(p.continent, (c.get(p.continent) || 0) + 1);
  return c;
}

function buildRegionCards() {
  const wrap = $('regionCards');
  wrap.replaceChildren();
  const counts = continentCounts();
  const list = [...counts.entries()].filter(([g]) => g !== '-').sort((a, b) => b[1] - a[1]);
  selectedGroups = new Set(list.map(([g]) => g));
  for (const [gid, count] of list) {
    const label = document.createElement('label');
    label.className = 'region-card';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = true;
    input.onchange = () => {
      if (input.checked) selectedGroups.add(gid); else selectedGroups.delete(gid);
      updateSetup();
    };
    const span = document.createElement('span');
    span.textContent = `${CONTINENT_CN[gid] || gid}（${count} 块）`;
    label.append(input, span);
    wrap.append(label);
  }
}

function computeEligible() {
  eligibleIds = new Set();
  eligibleTags = new Set();
  const all = $('scope').value === 'all';
  const only1444 = $('only1444').value === '1';
  for (const p of provinces) {
    if (p.kind !== 'country') continue;
    if (!all && !selectedGroups.has(p.continent)) continue;
    if (isCountryMode() && only1444) {
      const m = META[p.tag];
      if (m && m[0] === 0) continue;
    }
    eligibleIds.add(p.idx);
    eligibleTags.add(p.tag);
  }
}

function scopeProvinces() {
  return provinces.filter(p => eligibleIds.has(p.idx));
}

function buildQuestions() {
  if (isCountryMode()) {
    const map = new Map();
    for (const p of scopeProvinces()) {
      if (!map.has(p.tag)) map.set(p.tag, []);
      map.get(p.tag).push(p.idx);
    }
    return [...map.entries()].map(([tag, idxs]) => ({
      key: tag, name: CNAME[tag] || tag, flag: FLAG[tag], idxs
    }));
  }
  const map = new Map();
  for (const p of scopeProvinces()) {
    if (!map.has(p.name)) map.set(p.name, []);
    map.get(p.name).push(p.idx);
  }
  return [...map.entries()].map(([name, idxs]) => ({ key: name, name, idxs }));
}

function modeNeed() {
  const m = $('mode').value;
  return m === 'normal' ? 10 : m === 'challenge' ? 30 : m === 'nightmare' ? 50 : Infinity;
}

function ratingFor(acc) {
  if (acc > 90) return '精罗落泪';
  if (acc > 60) return '真正的罗马人';
  if (acc > 40) return '神罗也算罗？';
  if (acc > 20) return '精罗震怒';
  if (acc < 10) return '奥斯曼人来了';
  return '精罗震怒';
}

function flagUrl(name) { return FLAG_BASE + encodeURIComponent(name); }

function updateSetup() {
  if (!provinces.length) return;
  const country = isCountryMode();
  $('tagline').textContent = country ? '全地图 · 认国旗' : '全地图 · 猜地块';
  $('only1444').disabled = !country;
  $('scopeWrap').hidden = false;
  const scope = $('scope').value;
  $('regionPicker').hidden = scope !== 'regions';
  computeEligible();
  const qn = buildQuestions().length;
  const take = Math.min(modeNeed(), qn);
  $('start').disabled = !qn;
  $('selectionCount').textContent = `已选 ${selectedGroups.size} 个区域 · ${eligibleIds.size} 个地块`;
  const unit = country ? '个国家' : '道题';
  $('modeHelp').textContent = scope === 'regions'
    ? `从所选区域中随机抽取 ${take} ${unit}。`
    : `从全部 ${qn} ${unit}中随机抽取 ${take} ${unit}。`;
  $('coverage').textContent = country
    ? `全地图 · ${provinceCount} 个地块 · ${eligibleTags.size} 个可出题国家`
    : `全地图 · ${provinceCount} 个地块 · 共 ${qn} 道题`;
  $('edition').textContent = country ? '猜国家' : '猜地块';
  state = 'setup';
  currentIds = [];
  render();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatElapsed(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = String(total % 60).padStart(2, '0');
  return `${h ? h + '小时' : ''}${m}分${s}秒`;
}

function stats() {
  $('score').textContent = score;
  $('accuracy').textContent = completed.size ? (score / completed.size * 100).toFixed(1) + '%' : '—';
  $('cleared').textContent = `已完成 ${completed.size} / ${queue.length || 0}`;
}

function updateElapsed() {
  $('liveElapsed').textContent = formatElapsed(queue.length ? (gameEndedAt === null ? performance.now() : gameEndedAt) - gameStartedAt : 0);
}

function tick() {
  updateElapsed();
  if (!active) return;
  if (!seconds) { $('time').textContent = '不限时'; $('progress').style.width = '100%'; return; }
  const left = Math.max(0, (deadline - performance.now()) / 1000);
  $('time').innerHTML = Math.ceil(left) + '<span>秒</span>';
  $('progress').style.width = (left / seconds * 100) + '%';
  if (left <= 0) finish(false, '时间到');
}

function ask() {
  if (index >= queue.length) { showResults(); return; }
  active = true;
  currentIds = [];
  const q = queue[index];
  const country = isCountryMode();
  const flagBox = $('flagBox');
  if (country) {
    $('target').textContent = q.name;
    if (q.flag) {
      $('flagImg').src = flagUrl(q.flag);
      $('flagImg').alt = q.name + ' 国旗';
      $('flagAlt').textContent = '点出它的任意领土';
      flagBox.classList.add('on');
    } else {
      flagBox.classList.remove('on');
    }
  } else {
    flagBox.classList.remove('on');
    $('target').textContent = q.name;
  }
  $('eyebrow').textContent = country ? '这是哪国的领土？' : '请在地图上找到';
  $('round').textContent = `${index + 1} / ${queue.length}`;
  $('message').textContent = country
    ? '点击该国任意一块领土作答；也可拖拽、缩放地图。'
    : '点击对应的地块作答；也可拖拽、缩放地图。';
  $('next').disabled = true;
  $('next').textContent = index === queue.length - 1 ? '查看成绩 →' : '下一题 →';
  deadline = seconds ? performance.now() + seconds * 1000 : 0;
  tick();
  render();
}

function finish(correct, reason) {
  if (!active) return;
  active = false;
  const q = queue[index];
  const country = isCountryMode();
  q.idxs.forEach(i => { provinces[i].status = correct ? 'correct' : 'incorrect'; });
  completed.add(q.key);
  if (correct) { score++; playTone(true); } else { missed.push(q.name); playTone(false); }
  currentIds = q.idxs.slice();
  $('eyebrow').textContent = correct ? '✓ 定位成功' : '本题已结算';
  $('message').textContent = correct
    ? `答对了！${country ? '「' + q.name + '」的领土' : '「' + q.name + '」'}已标为青绿色。`
    : `${reason ? reason + '；' : '没有点中；'}${country ? '「' + q.name + '」的领土' : '「' + q.name + '」'}已标为粉红色，请记住它的位置。`;
  $('next').disabled = false;
  stats();
  render();
  if (index === queue.length - 1) gameEndedAt = performance.now();
}

function answer(idx) {
  if (state !== 'playing' || !active) return;
  if (seconds && performance.now() >= deadline) { tick(); return; }
  const p = provinces[idx];
  if (p && (p.kind === 'wasteland' || p.kind === 'uncolonized')) {
    $('message').textContent = p.kind === 'wasteland'
      ? '这是不可通行区域（高山 / 沙漠），不计入答题。'
      : '这是未殖民地区，1444 年不属于任何国家。';
    return;
  }
  if (!p || !eligibleIds.has(p.idx)) {
    $('message').textContent = '海面或“不出题”的灰色区域不算，请点击浅色地块。';
    return;
  }
  if (p.status !== 'unanswered') {
    $('message').textContent = '这块已经结算过了，请寻找当前目标。';
    return;
  }
  const q = queue[index];
  finish(q.idxs.includes(idx));
}

function showResults() {
  clearInterval(timer);
  active = false;
  state = 'result';
  $('flagBox').classList.remove('on');
  const acc = completed.size ? score / completed.size * 100 : 0;
  $('resultPanel').hidden = false;
  $('finalScore').textContent = completed.size ? acc.toFixed(1) + '%' : '—';
  $('rating').textContent = completed.size ? ratingFor(acc) : '—';
  $('totalElapsed').textContent = formatElapsed((gameEndedAt === null ? performance.now() : gameEndedAt) - gameStartedAt);
  $('resultTitle').textContent = (isCountryMode() ? '猜国家 · ' : '猜地块 · ') + ({
    normal: '正常模式完成', challenge: '挑战模式完成', nightmare: '噩梦模式完成', complete: '完全模式完成'
  }[$('mode').value] || '本轮挑战完成');
  $('summary').textContent = `答对 ${score} / ${queue.length}，答错或超时 ${queue.length - score}。`;
  $('review').textContent = missed.length ? '可以再记一记：' + missed.join('、') : '全部答对！';
  $('next').disabled = true;
  $('target').textContent = '本局完成';
  $('eyebrow').textContent = '正确率 ' + (completed.size ? (score / completed.size * 100).toFixed(1) + '%' : '—');
  $('message').textContent = '本局填色已保留，可继续放大查看。';
}

function start() {
  computeEligible();
  const pool = buildQuestions();
  if (!pool.length) return;
  for (const p of provinces) p.status = 'unanswered';
  queue = shuffle(pool.slice());
  const need = modeNeed();
  if (need !== Infinity) queue = queue.slice(0, Math.min(need, queue.length));
  index = 0; score = 0; missed = []; completed = new Set();
  currentIds = []; seconds = Number($('duration').value);
  gameStartedAt = performance.now(); gameEndedAt = null;
  state = 'playing'; active = true;
  $('startPanel').hidden = true;
  $('resultPanel').hidden = true;
  $('time').textContent = seconds ? seconds + ' 秒' : '不限时';
  fit(); stats(); ask();
  clearInterval(timer);
  timer = setInterval(tick, 80);
}

function resetGame() {
  active = false; state = 'setup';
  clearInterval(timer);
  queue = []; index = 0; score = 0; missed = []; completed = new Set();
  currentIds = []; gameStartedAt = 0; gameEndedAt = null;
  for (const p of provinces) p.status = 'unanswered';
  $('startPanel').hidden = false;
  $('resultPanel').hidden = true;
  $('flagBox').classList.remove('on');
  $('next').disabled = true;
  $('target').textContent = '看地名，点出它的地块';
  $('eyebrow').textContent = '准备探索';
  $('rating').textContent = '';
  $('message').textContent = '选择题库范围，开始挑战。';
  $('round').textContent = '—';
  $('time').textContent = '不限时';
  $('progress').style.width = '100%';
  updateElapsed(); stats(); updateSetup();
}

function playTone(ok) {
  if (!soundEnabled) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const notes = ok ? [523.25, 659.25, 783.99] : [349.23, 261.63];
    notes.forEach((f, i) => {
      const at = audioCtx.currentTime + i * 0.085;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(0.13, at + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, at + 0.24);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(at); osc.stop(at + 0.25);
    });
  } catch (e) { /* ignore */ }
}

function getLocalPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let lastAnswerAt = 0;
function tryAnswer(e) {
  const t = performance.now();
  if (t - lastAnswerAt < 300) return;
  lastAnswerAt = t;
  const { x: sx, y: sy } = getLocalPos(e);
  answer(pickAtScreen(sx, sy));
}

const pointers = new Map();
let drag = null, pinch = null, gestureMoved = false;

function pointerMid() {
  let x = 0, y = 0;
  for (const p of pointers.values()) { x += p.x; y += p.y; }
  const n = pointers.size || 1;
  return { x: x / n, y: y / n };
}
function pointerDist() {
  const ps = [...pointers.values()];
  return ps.length < 2 ? 0 : Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
}
function zoomAround(localX, localY, f) {
  const nz = Math.max(minZoom, Math.min(MAX_ZOOM, camera.zoom * f));
  if (nz === camera.zoom) return;
  const bx = (localX - camera.x) / camera.zoom, by = (localY - camera.y) / camera.zoom;
  camera.zoom = nz;
  camera.x = localX - bx * nz; camera.y = localY - by * nz;
  clampCamera(); updateZoomLabel();
}

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { type: e.pointerType, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, camx: camera.x, camy: camera.y, active: false };
    pinch = null; gestureMoved = false;
  } else if (pointers.size >= 2) {
    drag = null; pinch = { dist: pointerDist() }; gestureMoved = true;
  }
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) {
    const { x: sx, y: sy } = getLocalPos(e);
    const idx = pickAtScreen(sx, sy);
    if (idx !== hovered) { hovered = idx; render(); }
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pinch && pointers.size >= 2) {
    const d = pointerDist();
    if (pinch.dist > 0 && d > 0) {
      const r = cv.getBoundingClientRect();
      const m = pointerMid();
      zoomAround(m.x - r.left, m.y - r.top, d / pinch.dist);
      pinch.dist = d;
      render();
    }
    return;
  }
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.active) {
      const thr = p.type === 'touch' ? 12 : 4;
      if (Math.abs(dx) + Math.abs(dy) > thr) { drag.active = true; gestureMoved = true; }
    }
    if (drag.active) {
      camera.x = drag.camx + dx; camera.y = drag.camy + dy;
      clampCamera(); render();
    }
  }
});
cv.addEventListener('pointerup', e => {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    const tap = p && !gestureMoved && Math.abs(p.x - p.x0) + Math.abs(p.y - p.y0) <= 18;
    drag = null; pinch = null;
    if (tap) {
      lastAnswerAt = performance.now();
      const r = cv.getBoundingClientRect();
      answer(pickAtScreen(p.x0 - r.left, p.y0 - r.top));
    }
  } else if (pointers.size === 1) {
    pinch = null; gestureMoved = true;
    const en = [...pointers.entries()][0];
    drag = { id: en[0], sx: en[1].x, sy: en[1].y, camx: camera.x, camy: camera.y, active: true };
  }
});
cv.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { drag = null; pinch = null; }
});
cv.addEventListener('pointerleave', () => { if (!drag && hovered !== -1) { hovered = -1; render(); } });
cv.addEventListener('click', e => {
  if (gestureMoved) { gestureMoved = false; return; }
  tryAnswer(e);
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const { x: sx, y: sy } = getLocalPos(e);
  zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, sx, sy);
}, { passive: false });

$('zoomIn').onclick = () => zoomBy(1.35);
$('zoomOut').onclick = () => zoomBy(1 / 1.35);
$('fit').onclick = () => { hovered = -1; fit(); clampCamera(); render(); };
$('scope').onchange = updateSetup;
$('mode').onchange = updateSetup;
$('playmode').onchange = updateSetup;
$('only1444').onchange = updateSetup;
$('start').onclick = start;
$('again').onclick = start;
$('restart').onclick = resetGame;
$('viewMap').onclick = () => { $('resultPanel').hidden = true; };
$('sound').onclick = () => {
  soundEnabled = !soundEnabled;
  $('sound').textContent = soundEnabled ? '音效：开' : '音效：关';
  $('sound').setAttribute('aria-pressed', String(soundEnabled));
  if (soundEnabled) playTone(true);
};
$('next').onclick = () => {
  if (active || !queue.length || index >= queue.length) return;
  if (index < queue.length - 1) { index++; ask(); }
  else showResults();
};

window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (state !== 'playing' || !queue.length || index >= queue.length) return;
  e.preventDefault();
  if (!e.repeat && !$('next').disabled) $('next').click();
});

window.addEventListener('resize', () => { resizeCanvas(); fit(); clampCamera(); render(); });

resizeCanvas();
fit();
render();
loadMap();
</script>
</body>
</html>
